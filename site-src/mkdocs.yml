site_name: MicroRaft
site_description: "MicroRaft is an embeddable Java Raft library for consensus, metadata stores, coordination services, and control-plane systems."
site_url: https://microraft.io
site_author: "Ensar Basri Kahveci"
docs_dir: src
use_directory_urls: true
theme:
  name: flatly
  custom_dir: overrides

extra:
  social_image: img/microraft-sticker.png
  x_handle: "@MicroRaft"

plugins:
  - search

markdown_extensions:
  - attr_list
  - fenced_code
  - md_in_html

extra_css:
  - stylesheets/microraft.css

extra_javascript:
  - javascripts/demo.js

nav:
  - Home: "index.md"
  - Demo: "demo.md"
  - "Docs":
      - "Start Here": "docs/documentation.md"
      - "Why MicroRaft?": "docs/why-microraft.md"
      - "Use Cases": "docs/use-cases.md"
      - "FAQ": "docs/faq.md"
      - Setup: "docs/setup.md"
      - Main Abstractions: "docs/main-abstractions.md"
      - Configuration: "docs/configuration.md"
      - "Tutorial: Building an Atomic Register": "docs/tutorial-building-an-atomic-register.md"
      - Resiliency and Fault Tolerance: "docs/resiliency-and-fault-tolerance.md"
      - Monitoring: "docs/monitoring.md"
      - Production Checklist: "docs/production-checklist.md"
      - Troubleshooting: "docs/troubleshooting.md"
      - "Recipe: Metadata Store": "docs/recipe-metadata-store.md"
      - "Recipe: Distributed Lock Service": "docs/recipe-distributed-lock-service.md"
      - "Recipe: Coordination Service": "docs/recipe-coordination-service.md"
      - Benchmarks: "docs/benchmarks.md"
      - AfloatDB - Distributed Key-Value Store: "docs/afloatdb.md"
      - Javadoc: https://javadoc.io/doc/io.microraft/microraft
      - Release Notes: "docs/release-notes.md"
      - Roadmap: "docs/roadmap.md"
  - "Blog":
      - "All Blog Posts": "blog/index.md"
      - "April 5, 2023 | Queries in MicroRaft": "blog/2023-04-05-queries.md"
      - "February 15, 2023 | Log replication in MicroRaft": "blog/2023-02-15-log-replication.md"
      - "November 12, 2022 | Implementing the log": "blog/2022-11-12-implementing-the-log.md"
      - "September 8, 2021 | Today a Raft Follower, Tomorrow a Raft Leader": "blog/2021-09-08-today-a-raft-follower-tomorrow-a-raft-leader.md"
      - "September 3, 2021 | Introducing MicroRaft": "blog/2021-09-03-introducing-microraft.md"
