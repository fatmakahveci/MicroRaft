site_name: MicroRaft
site_description: "MicroRaft is an embeddable Java Raft library for consensus, metadata stores, coordination services, and control-plane systems."
site_url: https://microraft.io
site_author: "Ensar Basri Kahveci"
docs_dir: src
use_directory_urls: true
theme:
  name: flatly
  custom_dir: overrides

extra:
  social_image: img/microraft-sticker.png
  x_handle: "@MicroRaft"

plugins:
  - search

markdown_extensions:
  - attr_list
  - fenced_code
  - md_in_html

extra_css:
  - stylesheets/microraft.css

nav:
  - Home: "index.md"
  - "Docs":
      - "Getting Started":
          - "Docs Hub": "docs/documentation.md"
          - Setup: "docs/setup.md"
          - "Atomic Register Tutorial": "docs/tutorial-building-an-atomic-register.md"
          - "FAQ": "docs/faq.md"
      - "Evaluation":
          - "Why MicroRaft?": "docs/why-microraft.md"
          - "Use Cases": "docs/use-cases.md"
          - "Metadata Store Recipe": "docs/recipe-metadata-store.md"
          - "Lock Service Recipe": "docs/recipe-distributed-lock-service.md"
          - "Coordination Recipe": "docs/recipe-coordination-service.md"
          - Benchmarks: "docs/benchmarks.md"
          - AfloatDB: "docs/afloatdb.md"
      - "Operations":
          - Main Abstractions: "docs/main-abstractions.md"
          - Configuration: "docs/configuration.md"
          - Resiliency: "docs/resiliency-and-fault-tolerance.md"
          - Monitoring: "docs/monitoring.md"
          - Production Checklist: "docs/production-checklist.md"
          - Troubleshooting: "docs/troubleshooting.md"
          - Release Notes: "docs/release-notes.md"
          - Roadmap: "docs/roadmap.md"
          - Javadoc: https://javadoc.io/doc/io.microraft/microraft
  - "Blog":
      - "All Posts": "blog/index.md"
      - "Queries in MicroRaft": "blog/2023-04-05-queries.md"
      - "Log replication in MicroRaft": "blog/2023-02-15-log-replication.md"
      - "Implementing the log": "blog/2022-11-12-implementing-the-log.md"
      - "Today a Raft Follower, Tomorrow a Raft Leader": "blog/2021-09-08-today-a-raft-follower-tomorrow-a-raft-leader.md"
      - "Introducing MicroRaft": "blog/2021-09-03-introducing-microraft.md"
